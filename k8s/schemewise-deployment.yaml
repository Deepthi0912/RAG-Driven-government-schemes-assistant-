apiVersion: apps/v1
kind: Deployment
metadata:
  name: schemewise-api
  namespace: schemewise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schemewise-api
  template:
    metadata:
      labels:
        app: schemewise-api
    spec:
      containers:
        - name: schemewise-api
          image: schemewiseacrqn9.azurecr.io/schemewise-api:v4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: schemewise-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "4Gi"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: schemewise-api
  namespace: schemewise
spec:
  type: ClusterIP
  selector:
    app: schemewise-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schemewise-frontend
  namespace: schemewise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schemewise-frontend
  template:
    metadata:
      labels:
        app: schemewise-frontend
    spec:
      containers:
        - name: schemewise-frontend
          image: schemewiseacrqn9.azurecr.io/schemewise-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: BACKEND_URL
              value: "http://schemewise-api:8000"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8501
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: schemewise-frontend
  namespace: schemewise
spec:
  type: LoadBalancer
  selector:
    app: schemewise-frontend
  ports:
    - port: 80
      targetPort: 8501
