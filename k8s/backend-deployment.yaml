
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schemewise-api
  namespace: schemewise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schemewise-api
  template:
    metadata:
      labels:
        app: schemewise-api
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: schemewise-api
          image: schemewiseacrqn9.azurecr.io/schemewise-api:v6
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: schemewise-secrets
            - secretRef:
                name: schemewise-db-secret
